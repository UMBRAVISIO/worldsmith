<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>WORLDSMITH — Enter the World</title>
<style>
:root { --bg:#0a0908; --text:#d8cfc0; --accent:#e8862e; --dim:#8a7f6e; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height: 100%; background: var(--bg); overflow: hidden; }
body { display: flex; flex-direction: column; font-family: 'Inter', sans-serif; }
.topbar {
  display: flex; align-items: center; gap: 1rem;
  padding: 0.6rem 1.1rem;
  background: linear-gradient(180deg, #14110e, rgba(20,17,14,0));
  position: absolute; top: 0; left: 0; right: 0;
  z-index: 10;
}
.topbar .back {
  color: var(--dim); text-decoration: none; font-size: 0.85rem;
  letter-spacing: 0.08em; text-transform: uppercase;
}
.topbar .back:hover { color: var(--accent); }
.topbar h1 {
  font-family: 'IM Fell English', serif; font-weight: 400;
  font-size: 1.15rem; color: var(--text); margin: 0;
}
.topbar .tier {
  font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--accent); border: 1px solid #a05a1c; border-radius: 4px;
  padding: 0.15rem 0.5rem; opacity: 0.85;
}
#frame-wrap { position: absolute; inset: 0; }
#frame-wrap iframe { width: 100%; height: 100%; border: 0; }
#fallback {
  position: absolute; inset: 0; display: none;
  flex-direction: column; align-items: center; justify-content: center;
  text-align: center; color: var(--dim); padding: 2rem; gap: 1rem;
}
#fallback a { color: var(--accent); }
</style>
</head>
<body>
<div class="topbar">
  <a class="back" href="index.html">← All worlds</a>
  <h1 id="world-title"></h1>
  <span class="tier" id="world-tier" style="display:none"></span>
</div>
<div id="frame-wrap">
  <iframe id="viewer-frame" allow="xr-spatial-tracking; fullscreen" allowfullscreen></iframe>
</div>
<div id="fallback">
  <p>This world's splat isn't published yet.</p>
  <a href="index.html">← Back to the gallery</a>
</div>
<script>
const params = new URLSearchParams(location.search);
const id = params.get('id');
fetch('./manifest.json').then(r => r.json()).then(manifest => {
  const w = manifest.worlds.find(x => x.id === id);
  if (!w || !w.splat) {
    document.getElementById('frame-wrap').style.display = 'none';
    document.getElementById('fallback').style.display = 'flex';
    return;
  }
  document.getElementById('world-title').textContent = w.title;
  const tier = document.getElementById('tier');
  if (w.tier === 'plus') document.querySelector('.tier').style.display = 'inline';
  // self-hosted SuperSplat viewer, content injected via URL params
  const viewer = document.getElementById('viewer-frame');
  viewer.src = `viewer/index.html?content=../${w.splat}&poster=../${w.thumbnail}`;
});
</script>
</body>
</html>
