<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>WORLDSMITH — Enter the World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0908; --text: #d8cfc0; --dim: #8a7f6e;
  --accent: #e8862e; --accent-dim: #a05a1c; --border: #2a231a;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; background: var(--bg); overflow: hidden; }
body { font-family: 'Inter', sans-serif; }

/* ---- top bar ---- */
.topbar {
  position: absolute; top: 0; left: 0; right: 0; z-index: 20;
  display: flex; align-items: center; gap: 1rem;
  padding: 0.7rem 1.1rem;
  background: linear-gradient(180deg, rgba(20,17,14,0.92), rgba(20,17,14,0));
  pointer-events: none;
}
.topbar > * { pointer-events: auto; }
.topbar .back {
  color: var(--dim); text-decoration: none; font-size: 0.85rem;
  letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap;
}
.topbar .back:hover { color: var(--accent); }
.topbar h1 {
  font-family: 'IM Fell English', serif; font-weight: 400;
  font-size: 1.15rem; color: var(--text); margin: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.topbar .tier {
  font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--accent); border: 1px solid var(--accent-dim); border-radius: 4px;
  padding: 0.15rem 0.5rem; opacity: 0.85; white-space: nowrap;
}

/* ---- control cluster ---- */
.controls {
  position: absolute; bottom: 1.1rem; left: 50%; transform: translateX(-50%);
  z-index: 20; display: flex; gap: 0.5rem;
  padding: 0.45rem;
  background: rgba(10,9,8,0.72);
  border: 1px solid var(--border); border-radius: 10px;
  backdrop-filter: blur(6px);
}
.btn {
  display: flex; align-items: center; gap: 0.4rem;
  font-family: 'Inter', sans-serif; font-size: 0.72rem;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--dim); background: transparent;
  border: 1px solid transparent; border-radius: 6px;
  padding: 0.4rem 0.7rem; cursor: pointer; user-select: none;
}
.btn:hover { color: var(--text); }
.btn.active { color: var(--accent); border-color: var(--accent-dim); }
.btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.btn.hidden-mode { display: none; }

/* ---- fullscreen ---- */
:fullscreen .topbar, :-webkit-full-screen .topbar { z-index: 40; }
:fullscreen .controls, :-webkit-full-screen .controls { z-index: 40; }

/* ---- atmosphere overlays ---- */
.vignette {
  position: absolute; inset: 0; z-index: 10; pointer-events: none;
  background:
    radial-gradient(ellipse at center, transparent 52%, rgba(10,9,8,0.42) 100%),
    linear-gradient(180deg, rgba(20,17,14,0.35) 0%, transparent 18%, transparent 78%, rgba(10,9,8,0.5) 100%);
}
.fog {
  position: absolute; inset: -20%; z-index: 11; pointer-events: none; opacity: 0.55;
  background:
    radial-gradient(ellipse 42% 22% at 22% 68%, rgba(58,53,44,0.5), transparent 70%),
    radial-gradient(ellipse 50% 26% at 74% 34%, rgba(58,53,44,0.42), transparent 70%),
    radial-gradient(ellipse 36% 18% at 50% 85%, rgba(58,53,44,0.45), transparent 70%);
  filter: blur(14px);
  animation: fogdrift 46s linear infinite alternate;
}
@keyframes fogdrift {
  from { transform: translate3d(-4%, 0, 0) scale(1); }
  to   { transform: translate3d(4%, -1%, 0) scale(1.05); }
}
@media (prefers-reduced-motion: reduce) { .fog { animation: none; } }

/* ---- hint & loader ---- */
.hint {
  position: absolute; bottom: 4.6rem; left: 50%; transform: translateX(-50%);
  z-index: 20; color: var(--dim); font-size: 0.78rem; font-style: italic;
  font-family: 'IM Fell English', serif; letter-spacing: 0.05em;
  text-shadow: 0 1px 4px rgba(0,0,0,0.8);
  opacity: 1; transition: opacity 1.2s ease; pointer-events: none;
}
.hint.faded { opacity: 0; }
.loader {
  position: absolute; inset: 0; z-index: 30;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem;
  background: var(--bg); color: var(--dim);
  font-family: 'IM Fell English', serif; font-style: italic; letter-spacing: 0.06em;
  transition: opacity 0.6s ease;
}
.loader.gone { opacity: 0; pointer-events: none; }
.loader .flame {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 18px 6px rgba(232,134,46,0.45);
  animation: flicker 1.6s ease-in-out infinite;
}
@keyframes flicker {
  0%, 100% { transform: scale(1); opacity: 1; }
  40% { transform: scale(0.86); opacity: 0.75; }
  70% { transform: scale(1.08); opacity: 0.9; }
}
.error-box {
  position: absolute; inset: 0; z-index: 35; display: none;
  flex-direction: column; align-items: center; justify-content: center; gap: 1rem;
  background: var(--bg); color: var(--dim); text-align: center; padding: 2rem;
}
.error-box a { color: var(--accent); }
@media (max-width: 640px) {
  .topbar h1 { font-size: 1rem; }
  .btn span { display: none; } /* icon-only buttons on small screens */
  .btn { padding: 0.45rem 0.55rem; }
}
</style>
</head>
<body>
<div class="topbar">
  <a class="back" href="index.html">&#8592; All worlds</a>
  <h1 id="world-title">Loading&hellip;</h1>
  <span class="tier" id="world-tier" style="display:none"></span>
</div>

<div id="pano-mount" style="position:absolute;inset:0"></div>

<div class="vignette"></div>
<div class="fog"></div>
<div class="hint" id="hint">drag to look around &middot; scroll or pinch to draw the world closer</div>

<div class="controls">
  <button class="btn" id="btn-rotate" title="Toggle slow drift">
    <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
    <span>Drift</span>
  </button>
  <button class="btn hidden-mode" id="btn-audio" title="Toggle ambience">
    <svg viewBox="0 0 24 24">
      <path d="M11 5 6 9H3v6h3l5 4z"/>
      <g class="waves"><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 6a8.5 8.5 0 0 1 0 12"/></g>
      <g class="mute"><path d="M16 9l6 6"/><path d="M22 9l-6 6"/></g>
    </svg>
    <span>Ambience</span>
  </button>
  <button class="btn hidden-mode" id="btn-vr" title="VR cardboard view">
    <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="12" rx="3"/><circle cx="8" cy="13" r="2.4"/><circle cx="16" cy="13" r="2.4"/></svg>
    <span>VR</span>
  </button>
  <button class="btn" id="btn-fs" title="Fullscreen">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    <span>Full</span>
  </button>
</div>

<div class="loader" id="loader"><div class="flame"></div><div>Kindling the world&hellip;</div></div>
<div class="error-box" id="error-box">
  <p id="error-msg">This world could not be lit.</p>
  <a href="index.html">&#8592; Back to the gallery</a>
</div>

<audio id="ambience" loop preload="none"></audio>

<script src="pano/viewer.js?v=9"></script>
  <script src="pano/viewer2d.js?v=4"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var id = params.get('id');

  fetch('./manifest.json')
    .then(function (r) { return r.json(); })
    .then(function (manifest) {
      var w = manifest.worlds.find(function (x) { return x.id === id; });
      if (!w) throw new Error('World not found: ' + id);
      document.title = 'WORLDSMITH — ' + w.title;
      document.getElementById('world-title').textContent = w.title;
      if (w.tier === 'plus') {
        var t = document.getElementById('world-tier');
        t.textContent = 'Full quality';
        t.style.display = 'inline';
      }

      var panoSrc = w.pano;
      if (!panoSrc) throw new Error('This world has no panorama yet.');
      var opts = {
        src: panoSrc,
        startFov: 78,
        autoRotate: false,
        onError: function () {
          document.getElementById('error-box').style.display = 'flex';
          document.getElementById('loader').classList.add('gone');
        }
      };
      // per-world initial heading (deg; 0 = centre column of the equirect).
      // Worlds without a measured feature keep the viewers' default (180).
      if (typeof w.startLon === 'number') opts.startLon = w.startLon;
      if (typeof w.startLat === 'number') opts.startLat = w.startLat;
      /* Viewer selection.
       * WebGL is used only when ALL of these hold:
       *  1. the unmasked renderer string names a recognisable hardware GPU
       *     (Brave's fingerprint protection farbles it to e.g. "Brave", so an
       *     unknown/generic string is treated as untrusted -> 2D viewer);
       *  2. it is not a software rasteriser (SwiftShader/llvmpipe/softpipe);
       *  3. after the pano loads, a behavioural self-test (draw two azimuths,
       *     read pixels back) shows real, moving output.
       * Anything else gets Viewer2D, which always composites.
       * Override for testing: ?viewer=gl or ?viewer=2d. */
      var mountEl = document.getElementById('pano-mount');
      var forced = params.get('viewer');
      var renderer = '';
      try {
        var probeGL = document.createElement('canvas').getContext('webgl');
        var dbg = probeGL && probeGL.getExtension('WEBGL_debug_renderer_info');
        renderer = probeGL ? String(dbg ? probeGL.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : '') : '';
        var lose = probeGL && probeGL.getExtension('WEBGL_lose_context');
        if (lose) lose.loseContext();
      } catch (e) { renderer = ''; }
      var softwareGL = /swiftshader|softpipe|llvmpipe|software|microsoft basic render/i.test(renderer);
      var knownGPU = /(nvidia|geforce|quadro|radeon|amd|\bati\b|intel|iris|\buhd\b|\bhd graphics|mesa|apple|\bm[1-9]\b|adreno|mali|powervr|videocore|tegra|immortalis|xclipse)/i.test(renderer);
      var useGL = forced === 'gl' || (forced !== '2d' && knownGPU && !softwareGL);
      window.__viewerPick = { renderer: renderer, softwareGL: softwareGL, knownGPU: knownGPU, useGL: useGL, kind: null, selfTest: null };

      var onLoaded = function () {
        document.getElementById('loader').classList.add('gone');
        setTimeout(function () { document.getElementById('hint').classList.add('faded'); }, 4500);
      };
      var mount2D = function (o) {
        var v = new Viewer2D(mountEl, o || opts);
        v.onLoad = onLoaded;
        window.__viewerPick.kind = 'Viewer2D';
        return v;
      };
      var view;
      if (useGL) {
        try {
          view = PanoViewer.mount(mountEl, opts);
          window.__viewerPick.kind = 'PanoViewer';
          view.onLoad = function () {
            var ok = view.selfTest();
            window.__viewerPick.selfTest = ok;
            if (!ok && forced !== 'gl') {
              // WebGL drew nothing or didn't move: swap to the 2D viewer, keeping the pose.
              var o = Object.assign({}, opts, { startLon: view.lon, startLat: view.lat });
              view.destroy();
              view = mount2D(o);
              return;
            }
            onLoaded();
          };
        } catch (e) {
          view = mount2D();
        }
      } else {
        view = mount2D();
      }

            /* --- controls --- */
      var btnRotate = document.getElementById('btn-rotate');
      btnRotate.addEventListener('click', function () {
        var on = !view.autoRotate;
        view.setAutoRotate(on);
        btnRotate.classList.toggle('active', on);
      });

      /* --- ambience: manifest-driven, fade in/out, localStorage preference ---
       * Worlds without an `ambience` field keep the button hidden (as before).
       * First toggle unmutes and fades in (browser autoplay policy: a user
       * gesture is required anyway). A missing/404 audio file hides the
       * button and logs nothing. */
      var AMBIENCE_KEY = 'worldsmith-ambience-muted';
      var AMBIENCE_FADE_MS = 800;
      var AMBIENCE_VOL = 0.35; // deliberately subtle
      var audio = document.getElementById('ambience');
      var btnAudio = document.getElementById('btn-audio');
      var audioFadeTimer = null;

      // The icon reflects user intent, not instantaneous volume: mid-fade the
      // element is playing but still silent, and sampling audio.paused/volume
      // then would flash the mute icon for 800ms.
      var audioOn = false;
      function audioIntent() {
        btnAudio.classList.toggle('active', audioOn);
        var g = btnAudio.querySelector('svg');
        if (g) {
          g.querySelector('.waves').style.display = audioOn ? '' : 'none';
          g.querySelector('.mute').style.display = audioOn ? 'none' : '';
        }
      }

      function audioFade(target, done) {
        if (audioFadeTimer) { clearInterval(audioFadeTimer); audioFadeTimer = null; }
        var from = audio.volume;
        var t0 = performance.now();
        audioFadeTimer = setInterval(function () {
          var k = Math.min(1, (performance.now() - t0) / AMBIENCE_FADE_MS);
          // ease-in-out for a soft edge; clamped so it never overshoots
          var eased = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
          audio.volume = Math.max(0, Math.min(1, from + (target - from) * eased));
          if (k >= 1) {
            clearInterval(audioFadeTimer); audioFadeTimer = null;
            if (done) done();
          }
        }, 40);
      }

      function setupAudio(w) {
        if (!w.ambience) return; // no field: button stays hidden, exactly as today
        btnAudio.classList.remove('hidden-mode');
        audio.src = w.ambience; // preload="none": nothing fetched until first play
        audio.volume = AMBIENCE_VOL;
        audio.addEventListener('error', function () {
          // 404/missing file: hide the control, stay silent, no console noise
          btnAudio.classList.add('hidden-mode');
          btnAudio.classList.remove('active');
        });
        btnAudio.addEventListener('click', function () {
          if (audio.paused) {
            // Snap to silence BEFORE play resolves: play() can resolve in a few ms
            // (well inside the first fade tick), which would make from==target and
            // turn the ramp into a no-op pop. Set the target volume on the element
            // up front; the fade still animates the audible ramp from 0.
            audio.volume = 0;
            audio.play().then(function () {
              audioOn = true;
              try { localStorage.setItem(AMBIENCE_KEY, '0'); } catch (e) {}
              audioFade(AMBIENCE_VOL);
              audioIntent();
            }).catch(function () {
              // decode failure etc: treat as missing
              btnAudio.classList.add('hidden-mode');
            });
          } else {
            audioOn = false;
            audioFade(0, function () { audio.pause(); });
            try { localStorage.setItem(AMBIENCE_KEY, '1'); } catch (e) {}
            audioIntent();
          }
        });
        audioIntent(); // initial state: muted/off icon
      }
      setupAudio(w);

      var btnVr = document.getElementById('btn-vr');
      if ('xr' in navigator && navigator.isSessionSupported) {
        navigator.isSessionSupported('immersive-vr').then(function (ok) {
          if (ok) btnVr.classList.remove('hidden-mode');
        }).catch(function () {});
      }

      document.getElementById('btn-fs').addEventListener('click', function () {
        var d = document.documentElement;
        if (document.fullscreenElement) document.exitFullscreen();
        else if (d.requestFullscreen) d.requestFullscreen();
        else if (d.webkitRequestFullscreen) d.webkitRequestFullscreen();
      });

      // deep link: ?id=...&lon=..&lat=..&fov=..
      if (params.get('lon') != null || params.get('lat') != null || params.get('fov') != null) {
        view.lookAt(parseFloat(params.get('lon')), parseFloat(params.get('lat')), parseFloat(params.get('fov')));
      }
    })
    .catch(function (err) {
      document.getElementById('world-title').textContent = 'Not found';
      document.getElementById('error-msg').textContent = String(err.message || err);
      document.getElementById('error-box').style.display = 'flex';
      document.getElementById('loader').classList.add('gone');
    });
})();
</script>
</body>
</html>
